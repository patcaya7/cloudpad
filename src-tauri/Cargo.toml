[package]
name = "cloudpad"
version = "0.6.76"
description = "CloudPad offline-first notepad"
authors = ["CloudPad"]
homepage = "https://drive.google.com/drive/folders/1GJXNIPLtO5VnS0SPS4heBSkL0gNKzFbZ"
license = "MIT"
edition = "2021"

[lib]
name = "cloudpad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
